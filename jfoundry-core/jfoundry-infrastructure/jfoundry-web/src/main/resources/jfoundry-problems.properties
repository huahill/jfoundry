# JFoundry problem message catalog (root bundle, English).
# Keys follow problem.<type>.title and problem.<type>.detail; localized bundles must keep identical keys.
# MessageFormat placeholders like {0} interpolate exception problem arguments.

problem.invalid-argument.title=Invalid argument
problem.not-found.title=Not found
problem.conflict.title=Conflict
problem.external-access.title=Service temporarily unavailable
problem.external-access.detail=The requested operation is temporarily unavailable.
problem.domain-rule-violation.title=Domain rule violation
problem.domain-state.title=Domain state conflict
problem.request-validation.title=Request validation failed
problem.request-validation.detail=The request failed validation. See 'errors' for details.
problem.type-mismatch.property-detail=Failed to convert request value for '{0}'.
problem.type-mismatch.request-detail=Failed to convert a request value.
problem.validation.fallback-detail=is invalid
problem.http-bad-request.title=Bad request
problem.http-bad-request.detail=The request is invalid.
problem.http-not-found.title=Not found
problem.http-not-found.detail=The requested resource was not found.
problem.http-method-not-allowed.title=Method not allowed
problem.http-method-not-allowed.detail=The HTTP method is not allowed for this resource.
problem.http-not-acceptable.title=Not acceptable
problem.http-not-acceptable.detail=The requested representation is not available.
problem.http-payload-too-large.title=Payload too large
problem.http-payload-too-large.detail=The request payload is too large.
problem.http-unsupported-media-type.title=Unsupported media type
problem.http-unsupported-media-type.detail=The request media type is not supported.
problem.http-service-unavailable.title=Service unavailable
problem.http-service-unavailable.detail=The service is temporarily unavailable.
problem.http-internal-error.title=Internal server error
problem.http-internal-error.detail=The server failed to process the request.
