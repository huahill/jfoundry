  relativePath: ../../pom.yaml
artifactId: jfoundry-spring
name: jfoundry-spring
description: "Spring runtime integration for jfoundry framework-neutral contracts. Spring Framework\n        adapters, Spring Boot auto-configuration, and Spring Boot starters are grouped by\n        responsibility."
