modelVersion: 4.1.0
parent:
  groupId: io.github.xfoundries
  artifactId: jfoundry-spring
  version: 1.5.0-SNAPSHOT
  relativePath: ../../pom.yaml
artifactId: jfoundry-transaction-spring
name: jfoundry-transaction-spring
description: "Spring runtime adapter for jfoundry application transaction boundaries."
dependencies:
  - groupId: io.github.xfoundries
    artifactId: jfoundry-transaction-core
  - groupId: org.jmolecules
    artifactId: jmolecules-onion-architecture
  - groupId: org.springframework
    artifactId: spring-tx
    scope: provided
    optional: "true"
  - groupId: org.springframework
    artifactId: spring-aop
    scope: provided
    optional: "true"
  - groupId: org.junit.jupiter
    artifactId: junit-jupiter
    scope: test
  - groupId: org.assertj
    artifactId: assertj-core
    scope: test
