modelVersion: 4.0.0
parent:
  groupId: io.github.xfoundries
  artifactId: jfoundry-spring
  version: 1.5.0-SNAPSHOT
  relativePath: ../../pom.yaml
artifactId: jfoundry-restclient-spring
name: jfoundry-restclient-spring
description: "Spring RestClient adapter for jfoundry outbound HTTP support and logging."
dependencies:
  - groupId: io.github.xfoundries
    artifactId: jfoundry-application-core
  - groupId: io.github.xfoundries
    artifactId: jfoundry-http-spring
  - groupId: org.springframework
    artifactId: spring-web
    scope: provided
    optional: "true"
  - groupId: org.slf4j
    artifactId: slf4j-api
    scope: provided
  - groupId: org.junit.jupiter
    artifactId: junit-jupiter
    scope: test
  - groupId: org.assertj
    artifactId: assertj-core
    scope: test
  - groupId: org.springframework
    artifactId: spring-test
    scope: test
  - groupId: ch.qos.logback
    artifactId: logback-classic
    scope: test
