modelVersion: 4.0.0
parent:
  groupId: io.github.xfoundries
  artifactId: jfoundry-spring
  version: 1.4.0-SNAPSHOT
  relativePath: ../../pom.yaml
artifactId: jfoundry-restclient-spring-boot-starter
name: jfoundry-restclient-spring-boot-starter
description: "Spring Boot starter for jfoundry outbound RestClient support and HTTP logging."
dependencies:
  - groupId: io.github.xfoundries
    artifactId: jfoundry-spring-boot-starter
  - groupId: io.github.xfoundries
    artifactId: jfoundry-restclient-spring
  - groupId: io.github.xfoundries
    artifactId: jfoundry-restclient-spring-boot-autoconfigure
  - groupId: org.springframework.boot
    artifactId: spring-boot-starter-restclient
build:
  plugins:
    - groupId: org.apache.maven.plugins
      artifactId: maven-javadoc-plugin
      configuration:
        skip: "true"
    - groupId: org.apache.maven.plugins
      artifactId: maven-jar-plugin
      executions:
        - id: attach-empty-javadoc
          phase: package
          goals:
            - jar
          configuration:
            classesDirectory: ${maven.multiModuleProjectDirectory}/.mvn/javadoc-placeholder
            classifier: javadoc
            includes:
              - README.md
