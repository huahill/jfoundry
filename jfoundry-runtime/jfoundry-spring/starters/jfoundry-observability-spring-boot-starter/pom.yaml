modelVersion: 4.0.0
parent:
  groupId: io.github.xfoundries
  artifactId: jfoundry-spring
  version: 1.5.0-SNAPSHOT
  relativePath: ../../pom.yaml
artifactId: jfoundry-observability-spring-boot-starter
name: jfoundry-observability-spring-boot-starter
description: "Spring Boot starter for Micrometer Observation of jfoundry framework operations."
properties:
  mockito.javaagent.argLine: "-javaagent:${org.mockito:mockito-core:jar}"
dependencies:
  - groupId: io.github.xfoundries
    artifactId: jfoundry-spring-boot-starter
  - groupId: io.github.xfoundries
    artifactId: jfoundry-observability-spring
  - groupId: io.github.xfoundries
    artifactId: jfoundry-observability-spring-boot-autoconfigure
  - groupId: org.springframework.boot
    artifactId: spring-boot-starter-actuator
  - groupId: org.springframework.boot
    artifactId: spring-boot-starter-aspectj
  - groupId: org.springframework.boot
    artifactId: spring-boot-starter-test
    scope: test
build:
  plugins:
    - groupId: org.apache.maven.plugins
      artifactId: maven-javadoc-plugin
      configuration:
        skip: "true"
    - groupId: org.apache.maven.plugins
      artifactId: maven-jar-plugin
      executions:
        - id: attach-empty-javadoc
          phase: package
          goals:
            - jar
          configuration:
            classesDirectory: ${maven.multiModuleProjectDirectory}/.mvn/javadoc-placeholder
            classifier: javadoc
            includes:
              - README.md
