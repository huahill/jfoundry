modelVersion: 4.1.0
parent:
  groupId: io.github.xfoundries
  artifactId: jfoundry-spring
  version: 1.5.0-SNAPSHOT
  relativePath: ../../pom.yaml
artifactId: jfoundry-outbox-jobrunr-spring-boot-starter
name: jfoundry-outbox-jobrunr-spring-boot-starter
description: "Spring Boot starter for the JobRunr Outbox dispatcher adapter."
dependencies:
  - groupId: io.github.xfoundries
    artifactId: jfoundry-outbox-spring-boot-starter
  - groupId: io.github.xfoundries
    artifactId: jfoundry-outbox-jobrunr
  - groupId: org.jobrunr
    artifactId: jobrunr-spring-boot-4-starter
build:
  plugins:
    - groupId: org.apache.maven.plugins
      artifactId: maven-javadoc-plugin
      configuration:
        skip: "true"
    - groupId: org.apache.maven.plugins
      artifactId: maven-jar-plugin
      executions:
        - id: attach-empty-javadoc
          phase: package
          goals:
            - jar
          configuration:
            classesDirectory: ${maven.multiModuleProjectDirectory}/.mvn/javadoc-placeholder
            classifier: javadoc
            includes:
              - README.md
