jfoundry:
  outbox:
    dispatcher:
      interval: 100ms
      batch-size: 10
      max-retries: 3
      backoff-base: 50ms
      backoff-max: 1s

spring:
  datasource:
    url: jdbc:h2:mem:jfoundry-starter-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:outbox_event.sql
