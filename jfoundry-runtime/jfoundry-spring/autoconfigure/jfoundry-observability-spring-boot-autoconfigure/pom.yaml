  relativePath: ../../pom.yaml
artifactId: jfoundry-observability-spring-boot-autoconfigure
name: jfoundry-observability-spring-boot-autoconfigure
description: "Spring Boot auto-configuration for jfoundry Micrometer Observation."
dependencies:
