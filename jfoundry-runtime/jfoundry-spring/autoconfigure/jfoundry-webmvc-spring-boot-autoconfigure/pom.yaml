modelVersion: 4.0.0
parent:
  groupId: io.github.xfoundries
  artifactId: jfoundry-spring
  version: 1.4.0-SNAPSHOT
  relativePath: ../../pom.yaml
artifactId: jfoundry-webmvc-spring-boot-autoconfigure
name: jfoundry-webmvc-spring-boot-autoconfigure
description: "Spring Boot auto-configuration for jfoundry Spring MVC integrations."
dependencies:
  - groupId: io.github.xfoundries
    artifactId: jfoundry-webmvc-spring
  - groupId: io.github.xfoundries
    artifactId: jfoundry-web
  - groupId: org.springframework.boot
    artifactId: spring-boot-autoconfigure
  - groupId: org.springframework.boot
    artifactId: spring-boot-configuration-processor
    optional: "true"
  - groupId: org.springframework
    artifactId: spring-web
    scope: provided
    optional: "true"
  - groupId: jakarta.servlet
    artifactId: jakarta.servlet-api
    scope: provided
    optional: "true"
  - groupId: org.springframework.boot
    artifactId: spring-boot-starter-test
    scope: test
  - groupId: org.springframework.boot
    artifactId: spring-boot-starter-web
    scope: test
