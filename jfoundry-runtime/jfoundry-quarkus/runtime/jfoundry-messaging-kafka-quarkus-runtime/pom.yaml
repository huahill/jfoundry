modelVersion: 4.0.0
parent:
  groupId: io.github.xfoundries
  artifactId: jfoundry-quarkus
  version: 1.5.0-SNAPSHOT
  relativePath: ../../pom.yaml
artifactId: jfoundry-messaging-kafka-quarkus-runtime
name: jfoundry-messaging-kafka-quarkus-runtime
description: "Quarkus Kafka adapter for the jfoundry MessageSender SPI."
properties:
  mockito.javaagent.argLine: "-javaagent:${org.mockito:mockito-core:jar}"
dependencies:
  - groupId: io.github.xfoundries
    artifactId: jfoundry-messaging-core
  - groupId: io.quarkus
    artifactId: quarkus-arc
  - groupId: io.quarkus
    artifactId: quarkus-messaging-kafka
  - groupId: org.junit.jupiter
    artifactId: junit-jupiter
    scope: test
  - groupId: org.assertj
    artifactId: assertj-core
    scope: test
  - groupId: org.mockito
    artifactId: mockito-core
    scope: test
build:
  plugins:
    - groupId: io.quarkus
      artifactId: quarkus-extension-maven-plugin
      version: ${quarkus.version}
      executions:
        - phase: compile
          goals:
            - extension-descriptor
          configuration:
            deployment: "${project.groupId}:jfoundry-messaging-kafka-quarkus-deployment:${project.version}"
