modelVersion: 4.1.0
parent:
  groupId: io.github.xfoundries
  artifactId: jfoundry-quarkus
  version: 1.5.0-SNAPSHOT
  relativePath: ../../pom.yaml
artifactId: jfoundry-restclient-quarkus-deployment
name: jfoundry-restclient-quarkus-deployment
description: "Quarkus build-time integration for JFoundry REST client logging."
dependencies:
  - groupId: io.github.xfoundries
    artifactId: jfoundry-restclient-quarkus-runtime
    version: ${project.version}
  - groupId: io.quarkus
    artifactId: quarkus-rest-client-deployment
  - groupId: org.junit.jupiter
    artifactId: junit-jupiter
    scope: test
  - groupId: org.assertj
    artifactId: assertj-core
    scope: test
build:
  plugins:
    - groupId: org.apache.maven.plugins
      artifactId: maven-compiler-plugin
      configuration:
        annotationProcessorPaths:
          path:
            groupId: io.quarkus
            artifactId: quarkus-extension-processor
            version: ${quarkus.version}
    - groupId: org.apache.maven.plugins
      artifactId: maven-javadoc-plugin
      configuration:
        skip: "true"
    - groupId: org.apache.maven.plugins
      artifactId: maven-jar-plugin
      executions:
        - id: attach-empty-javadoc
          phase: package
          goals:
            - jar
          configuration:
            classesDirectory: ${maven.multiModuleProjectDirectory}/.mvn/javadoc-placeholder
            classifier: javadoc
            includes:
              - README.md
