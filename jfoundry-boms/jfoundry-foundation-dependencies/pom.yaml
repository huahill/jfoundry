child.project.url.inherit.append.path: "false"
modelVersion: 4.0.0
groupId: io.github.xfoundries
artifactId: jfoundry-foundation-dependencies
version: 1.4.0-SNAPSHOT
packaging: pom
name: jfoundry-foundation-dependencies
description: "Dependency management BOM for framework-neutral foundation libraries used by jfoundry."
url: ${jfoundry.release.url}
licenses:
  - name: "Apache License, Version 2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0.txt"
    distribution: repo
developers:
  - id: youngledo
    name: youngledo
scm:
  child.scm.connection.inherit.append.path: "false"
  child.scm.developerConnection.inherit.append.path: "false"
  child.scm.url.inherit.append.path: "false"
  connection: ${jfoundry.release.scm.connection}
  developerConnection: ${jfoundry.release.scm.developerConnection}
  url: ${jfoundry.release.scm.url}
  tag: v1.3.0
properties:
  project.build.outputTimestamp: "2026-08-23T16:38:24Z"
  jfoundry.release.url: "https://github.com/xfoundries/jfoundry"
  jfoundry.release.scm.connection: "scm:git:https://github.com/xfoundries/jfoundry.git"
  jfoundry.release.scm.developerConnection: "scm:git:https://github.com/xfoundries/jfoundry.git"
  jfoundry.release.scm.url: "https://github.com/xfoundries/jfoundry"
  maven-enforcer-plugin.version: 3.6.3
  maven-gpg-plugin.version: 3.2.8
  central-publishing-maven-plugin.version: 0.11.0
  # Imported BOMs
  jmolecules.version: 2025.0.2
  junit-jupiter.version: 6.1.3
  # Domain modeling and architecture
  jmolecules-integrations.version: 0.33.0
  archunit.version: 1.5.0
  # Validation
  jakarta-validation.version: 3.1.1
  # Static analysis
  jspecify.version: 1.0.1
  # Portable Jakarta and MicroProfile runtime APIs
  jakarta-json.version: 2.1.3
  jakarta-rest.version: 4.0.0
  jakarta-transaction.version: 2.0.1
  microprofile-config.version: 3.1.1
  parsson.version: 1.1.9
  # Persistence and database integration
  mybatis-plus.version: 3.5.17
  jakarta-persistence.version: 3.2.0
  hibernate.version: 7.4.6.Final
  h2.version: 2.4.240
  mysql-connector-j.version: 26.7.0
  postgresql.version: 42.7.13
  # Serialization and data binding
  jackson3.version: 3.2.2
  # Mapping and code generation
  mapstruct.version: 1.5.5.Final
  # Apache Commons
  commons-codec.version: 1.22.1
  commons-collections4.version: 4.6.0
  commons-io.version: 2.22.0
  commons-lang3.version: 3.20.0
  commons-text.version: 1.15.0
  # Caching
  caffeine.version: 3.1.8
  # Messaging and background jobs
  jobrunr.version: 8.8.2
  kafka-clients.version: 4.3.1
  mqttv3.version: 1.2.5
  rabbitmq-amqp-client.version: 5.35.0
  redisson.version: 4.7.0
  rocketmq-client.version: 5.5.1
  # Runtime utilities
  javassist.version: 3.33.0-GA
  opentelemetry.version: 1.62.0
  slf4j.version: 2.0.18
  snakeyaml.version: "2.6"
  # Testing
  awaitility.version: 4.3.0
  assertj.version: 3.27.7
  byte-buddy.version: 1.18.12
  mockito.version: 5.23.0
  junit-platform.version: 6.1.3
  testcontainers.version: 1.21.4
dependencyManagement:
  dependencies:
    # Imported BOMs
    - groupId: org.jmolecules
      artifactId: jmolecules-bom
      version: ${jmolecules.version}
      type: pom
      scope: import
    - groupId: org.junit
      artifactId: junit-bom
      version: ${junit-jupiter.version}
      type: pom
      scope: import
    # Domain modeling and architecture
    - groupId: org.jmolecules.integrations
      artifactId: jmolecules-archunit
      version: ${jmolecules-integrations.version}
    - groupId: org.jmolecules.integrations
      artifactId: jmolecules-jackson3
      version: ${jmolecules-integrations.version}
    - groupId: com.tngtech.archunit
      artifactId: archunit-junit5
      version: ${archunit.version}
    - groupId: com.tngtech.archunit
      artifactId: archunit
      version: ${archunit.version}
    # Validation
    - groupId: jakarta.validation
      artifactId: jakarta.validation-api
      version: ${jakarta-validation.version}
    # Static analysis
    - groupId: org.jspecify
      artifactId: jspecify
      version: ${jspecify.version}
    # Portable Jakarta and MicroProfile runtime APIs
    - groupId: jakarta.json
      artifactId: jakarta.json-api
      version: ${jakarta-json.version}
    - groupId: jakarta.ws.rs
      artifactId: jakarta.ws.rs-api
      version: ${jakarta-rest.version}
    - groupId: jakarta.transaction
      artifactId: jakarta.transaction-api
      version: ${jakarta-transaction.version}
    - groupId: org.eclipse.microprofile.config
      artifactId: microprofile-config-api
      version: ${microprofile-config.version}
    - groupId: org.eclipse.parsson
      artifactId: parsson
      version: ${parsson.version}
    # Persistence and database integration
    - groupId: com.baomidou
      artifactId: mybatis-plus-annotation
      version: ${mybatis-plus.version}
    - groupId: com.baomidou
      artifactId: mybatis-plus-core
      version: ${mybatis-plus.version}
    - groupId: com.baomidou
      artifactId: mybatis-plus-extension
      version: ${mybatis-plus.version}
    - groupId: com.baomidou
      artifactId: mybatis-plus-jsqlparser
      version: ${mybatis-plus.version}
    - groupId: jakarta.persistence
      artifactId: jakarta.persistence-api
      version: ${jakarta-persistence.version}
    - groupId: org.hibernate.orm
      artifactId: hibernate-core
      version: ${hibernate.version}
    - groupId: com.h2database
      artifactId: h2
      version: ${h2.version}
    - groupId: com.mysql
      artifactId: mysql-connector-j
      version: ${mysql-connector-j.version}
    - groupId: org.postgresql
      artifactId: postgresql
      version: ${postgresql.version}
    # Serialization and data binding
    - groupId: tools.jackson.core
      artifactId: jackson-databind
      version: ${jackson3.version}
    # Mapping and code generation
    - groupId: org.mapstruct
      artifactId: mapstruct
      version: ${mapstruct.version}
    - groupId: org.mapstruct
      artifactId: mapstruct-processor
      version: ${mapstruct.version}
    # Apache Commons
    - groupId: commons-codec
      artifactId: commons-codec
      version: ${commons-codec.version}
    - groupId: org.apache.commons
      artifactId: commons-collections4
      version: ${commons-collections4.version}
    - groupId: commons-io
      artifactId: commons-io
      version: ${commons-io.version}
    - groupId: org.apache.commons
      artifactId: commons-lang3
      version: ${commons-lang3.version}
    - groupId: org.apache.commons
      artifactId: commons-text
      version: ${commons-text.version}
    # Caching
    - groupId: com.github.ben-manes.caffeine
      artifactId: caffeine
      version: ${caffeine.version}
    # Messaging and background jobs
    - groupId: org.eclipse.paho
      artifactId: org.eclipse.paho.client.mqttv3
      version: ${mqttv3.version}
    - groupId: org.jobrunr
      artifactId: jobrunr
      version: ${jobrunr.version}
    - groupId: org.apache.kafka
      artifactId: kafka-clients
      version: ${kafka-clients.version}
    - groupId: org.apache.rocketmq
      artifactId: rocketmq-client
      version: ${rocketmq-client.version}
    - groupId: com.rabbitmq
      artifactId: amqp-client
      version: ${rabbitmq-amqp-client.version}
    - groupId: org.redisson
      artifactId: redisson
      version: ${redisson.version}
    # Runtime utilities
    - groupId: io.opentelemetry
      artifactId: opentelemetry-api
      version: ${opentelemetry.version}
    - groupId: io.opentelemetry
      artifactId: opentelemetry-sdk
      version: ${opentelemetry.version}
    - groupId: io.opentelemetry
      artifactId: opentelemetry-sdk-testing
      version: ${opentelemetry.version}
    - groupId: org.javassist
      artifactId: javassist
      version: ${javassist.version}
    - groupId: org.slf4j
      artifactId: slf4j-api
      version: ${slf4j.version}
    - groupId: org.slf4j
      artifactId: slf4j-simple
      version: ${slf4j.version}
    - groupId: org.yaml
      artifactId: snakeyaml
      version: ${snakeyaml.version}
    # Testing
    - groupId: org.awaitility
      artifactId: awaitility
      version: ${awaitility.version}
    - groupId: org.assertj
      artifactId: assertj-core
      version: ${assertj.version}
    - groupId: org.mockito
      artifactId: mockito-core
      version: ${mockito.version}
    - groupId: net.bytebuddy
      artifactId: byte-buddy
      version: ${byte-buddy.version}
    - groupId: net.bytebuddy
      artifactId: byte-buddy-agent
      version: ${byte-buddy.version}
    - groupId: org.junit.jupiter
      artifactId: junit-jupiter
      version: ${junit-jupiter.version}
    - groupId: org.junit.platform
      artifactId: junit-platform-launcher
      version: ${junit-platform.version}
    - groupId: org.testcontainers
      artifactId: junit-jupiter
      version: ${testcontainers.version}
    - groupId: org.testcontainers
      artifactId: mysql
      version: ${testcontainers.version}
    - groupId: org.testcontainers
      artifactId: postgresql
      version: ${testcontainers.version}
    - groupId: org.testcontainers
      artifactId: kafka
      version: ${testcontainers.version}
    - groupId: org.testcontainers
      artifactId: rabbitmq
      version: ${testcontainers.version}
profiles:
  - id: release
    build:
      plugins:
        - groupId: org.apache.maven.plugins
          artifactId: maven-enforcer-plugin
          version: ${maven-enforcer-plugin.version}
          executions:
            - id: require-release-version
              goals:
                - enforce
              configuration:
                rules:
                  requireReleaseVersion: {}
        - groupId: org.apache.maven.plugins
          artifactId: maven-gpg-plugin
          version: ${maven-gpg-plugin.version}
          executions:
            - id: sign-artifacts
              phase: verify
              goals:
                - sign
        - groupId: org.sonatype.central
          artifactId: central-publishing-maven-plugin
          version: ${central-publishing-maven-plugin.version}
          extensions: "true"
          configuration:
            publishingServerId: jfoundry
            autoPublish: "true"
            waitUntil: PUBLISHED
