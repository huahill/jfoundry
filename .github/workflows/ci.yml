name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production-readiness-release
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$EVENT_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PULL_REQUEST_BASE"
          fi
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          run_full=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              README.md|README_ZH.md|docs/*)
                ;;
              *)
                run_full=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify documentation
        run: bash scripts/verify-docs.sh

      - name: Verify release workflow
        run: bash scripts/verify-release-workflow.sh

      - name: Verify release SBOM configuration
        run: bash scripts/verify-release-sbom.sh

      - name: Verify supply-chain workflows
        run: bash scripts/verify-supply-chain-workflows.sh

      - name: Test release governance verifiers
        run: |
          bash scripts/verify-release-workflow-test.sh
          bash scripts/verify-release-sbom-test.sh
          bash scripts/verify-supply-chain-workflows-test.sh

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-2.0-only, GPL-3.0-only, SSPL-1.0

  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        java:
          - 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  package:
    name: Package artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Package without tests
        run: ./mvnw -B -DskipTests package

  spring-integration:
    name: Spring middleware integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run Spring middleware integration tests
        run: JAVA_25_HOME="$JAVA_HOME" bash scripts/verify-runtime-ci.sh spring --stage middleware

  quarkus-integration:
    name: Quarkus middleware integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run Quarkus PostgreSQL integration tests
        run: JAVA_25_HOME="$JAVA_HOME" bash scripts/verify-runtime-ci.sh quarkus --stage middleware

  helidon-integration:
    name: Helidon middleware integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run Helidon PostgreSQL integration tests
        run: JAVA_25_HOME="$JAVA_HOME" bash scripts/verify-runtime-ci.sh helidon --stage middleware

  spring-native:
    name: Spring Native Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Build and smoke test Spring Native Image
        run: GRAALVM_HOME="$JAVA_HOME" bash scripts/verify-runtime-ci.sh spring --stage native

  spring-native-mybatis-plus:
    name: Spring Native Image (MyBatis-Plus)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Build and verify MyBatis-Plus Spring Native Image
        run: GRAALVM_HOME="$JAVA_HOME" bash scripts/verify-runtime-ci.sh spring --stage native-mybatis-plus

  spring-native-redisson:
    name: Spring Native Image (Redisson)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Build and verify Redisson Spring Native Image
        run: GRAALVM_HOME="$JAVA_HOME" bash scripts/verify-runtime-ci.sh spring --stage native-redisson

  spring-native-jobrunr:
    name: Spring Native Image (JobRunr)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Build and verify JobRunr Spring Native Image
        run: GRAALVM_HOME="$JAVA_HOME" bash scripts/verify-runtime-ci.sh spring --stage native-jobrunr

  quarkus-native:
    name: Quarkus Native Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run Quarkus Native Image smoke test
        run: JAVA_25_HOME="$JAVA_HOME" bash scripts/verify-runtime-ci.sh quarkus --stage native

  helidon-native:
    name: Helidon Native Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Build and smoke test Helidon Native Image
        run: GRAALVM_HOME="$JAVA_HOME" bash scripts/verify-runtime-ci.sh helidon --stage native

  maven-4:
    name: Maven 4 compatibility
    runs-on: ubuntu-latest
    needs: package
    env:
      MAVEN_VERSION: 4.0.0-rc-5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Install Maven 4
        run: |
          curl -fsSLo /tmp/apache-maven-${MAVEN_VERSION}-bin.tar.gz \
            https://archive.apache.org/dist/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz
          tar -xzf /tmp/apache-maven-${MAVEN_VERSION}-bin.tar.gz -C /tmp
          echo "/tmp/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check Maven 4 package compatibility
        run: mvn -B -DskipTests package

  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - docs
      - dependency-review
      - test
      - package
      - spring-integration
      - quarkus-integration
      - helidon-integration
      - spring-native
      - spring-native-mybatis-plus
      - spring-native-redisson
      - spring-native-jobrunr
      - quarkus-native
      - helidon-native
      - maven-4
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test merge requirements evaluator
        run: bash scripts/verify-merge-gate-test.sh

      - name: Verify merge requirements
        run: >-
          bash scripts/verify-merge-gate.sh
          "${{ needs.changes.outputs.run_full }}"
          "${{ github.event_name == 'pull_request' }}"
          "${{ needs.docs.result }}"
          "${{ needs.dependency-review.result }}"
          "${{ needs.test.result }}"
          "${{ needs.package.result }}"
          "${{ needs.spring-integration.result }}"
          "${{ needs.quarkus-integration.result }}"
          "${{ needs.helidon-integration.result }}"
          "${{ needs.spring-native.result }}"
          "${{ needs.spring-native-mybatis-plus.result }}"
          "${{ needs.spring-native-redisson.result }}"
          "${{ needs.spring-native-jobrunr.result }}"
          "${{ needs.quarkus-native.result }}"
          "${{ needs.helidon-native.result }}"
          "${{ needs.maven-4.result }}"
