name: Snapshot

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - README_ZH.md
      - AGENTS.md
      - docs/**
      - skills/**
  workflow_dispatch:

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-snapshot:
    name: Publish SNAPSHOT to Maven Central
    runs-on: ubuntu-latest
    environment: jfoundry
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: jfoundry
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          version="$(
            bash scripts/maven-project-version.sh
          )"
          case "${version}" in
            *-SNAPSHOT)
              echo "Publishing ${version}"
              echo "is_snapshot=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Skipping non-SNAPSHOT version: ${version}"
              echo "is_snapshot=false" >> "${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Publish SNAPSHOT
        if: steps.version.outputs.is_snapshot == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          log="${RUNNER_TEMP}/snapshot-deploy.log"
          deploy() {
            ./mvnw -B -T 1 -DskipTests deploy \
              -DaltDeploymentRepository=jfoundry::https://central.sonatype.com/repository/maven-snapshots/ \
              -Daether.connector.basic.parallelPut=false \
              -Daether.connector.basic.upstreamThreads=1 \
              -Daether.transport.http.maxConnectionsPerRoute=1 \
              -Daether.transport.http.retryHandler.count=6 \
              -Daether.transport.http.retryHandler.interval=15000
          }

          attempt=1
          max_attempts=4
          while true; do
            set +e
            deploy 2>&1 | tee "${log}"
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "${status}" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -Eq 'status=429|error-1015|Error 1015' "${log}"; then
              exit "${status}"
            fi
            if (( attempt >= max_attempts )); then
              exit "${status}"
            fi
            sleep_seconds=$(( attempt * 90 ))
            echo "Central Portal rate limited the snapshot deploy (attempt ${attempt}/${max_attempts}). Waiting ${sleep_seconds}s before retrying."
            sleep "${sleep_seconds}"
            attempt=$(( attempt + 1 ))
          done
