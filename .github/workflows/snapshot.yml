name: Snapshot

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - README_ZH.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-snapshot:
    name: Publish SNAPSHOT to Maven Central
    runs-on: ubuntu-latest
    environment: jfoundry
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: jfoundry
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          version="$(
            ./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout |
              sed -n 's/^\[INFO\] \[stdout\] //p' |
              tail -n 1
          )"
          case "${version}" in
            *-SNAPSHOT)
              echo "Publishing ${version}"
              echo "is_snapshot=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Skipping non-SNAPSHOT version: ${version}"
              echo "is_snapshot=false" >> "${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Publish SNAPSHOT
        if: steps.version.outputs.is_snapshot == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: >
          ./mvnw -B -DskipTests deploy
          -DaltDeploymentRepository=jfoundry::https://central.sonatype.com/repository/maven-snapshots/
