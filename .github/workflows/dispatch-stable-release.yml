name: Dispatch stable release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: dispatch-stable-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch trusted release workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Dispatch stable release from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-stable tag ${RELEASE_TAG}."
            exit 0
          fi
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${RELEASE_TAG}")"
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f "release_tag=${RELEASE_TAG}"
