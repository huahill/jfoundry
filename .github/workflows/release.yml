name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to publish, for example v1.0.0-RC1.
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  security-events: read
  attestations: write
  id-token: write

jobs:
  publish:
    name: Verify and publish Maven Central release
    runs-on: ubuntu-latest
    environment: jfoundry
    steps:
      - name: Verify release workflow source
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - name: Checkout immutable release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify immutable release source
        id: release_source
        run: |
          set -euo pipefail

          release_tag="${{ inputs.release_tag }}"
          git check-ref-format "refs/tags/${release_tag}"
          git show-ref --verify --quiet "refs/tags/${release_tag}"
          test "$(git cat-file -t "refs/tags/${release_tag}")" = "tag"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${release_tag}")"
          test -z "$(git status --porcelain)"
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main

          version="$(
            ./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout |
              sed -n 's/^\[INFO\] \[stdout\] //p' |
              tail -n 1
          )"
          test "${{ inputs.release_tag }}" = "v${version}"
          case "${version}" in
            *-SNAPSHOT)
              echo "Release tag resolves to a SNAPSHOT version: ${version}" >&2
              exit 1
              ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          bash scripts/verify-release-pom-metadata.sh

      - name: Verify complete CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"
          run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow CI --commit "${commit}" \
            --limit 100 --json databaseId,status,conclusion,createdAt \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | sort_by(.createdAt) | last | .databaseId')"
          if [[ -z "${run_id}" || "${run_id}" == "null" ]]; then
            echo "No successful CI run exists for release commit ${commit}." >&2
            exit 1
          fi

          required_jobs=(
            "Documentation checks"
            "Test (Java 25)"
            "Package artifacts"
            "Spring middleware integration"
            "Quarkus middleware integration"
            "Helidon middleware integration"
            "Spring Native Image"
            "Spring Native Image (MyBatis-Plus)"
            "Spring Native Image (Redisson)"
            "Spring Native Image (JobRunr)"
            "Quarkus Native Image"
            "Helidon Native Image"
            "Maven 4 compatibility"
            "Merge gate"
          )
          job_results="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json jobs \
            --jq '[.jobs[] | {key: .name, value: .conclusion}] | from_entries')"
          for required_job in "${required_jobs[@]}"; do
            conclusion="$(jq -r --arg job "${required_job}" '.[$job] // empty' <<< "${job_results}")"
            if [[ "${conclusion}" != "success" ]]; then
              echo "CI run ${run_id} lacks successful required job: ${required_job}" >&2
              exit 1
            fi
          done

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: jfoundry
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify signed release artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -Prelease -DskipTests verify -Dgpg.passphrase="${GPG_PASSPHRASE}"

      - name: Verify Maven Central Consumer POMs
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          consumer_pom_repository="${RUNNER_TEMP}/jfoundry-consumer-pom-repository"
          rm -rf "${consumer_pom_repository}"
          mkdir -p "${consumer_pom_repository}"
          ./mvnw -B -Prelease -DskipTests -Dmaven.repo.local="${consumer_pom_repository}" \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" install

          version="$(
            ./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout |
              sed -n 's/^\[INFO\] \[stdout\] //p' |
              tail -n 1
          )"
          bash scripts/verify-consumer-pom.sh "${consumer_pom_repository}" "${version}" \
            "$(command -v mvn)" "$(pwd)/mvnw"
          echo "CONSUMER_POM_REPOSITORY=${consumer_pom_repository}" >> "${GITHUB_ENV}"

      - name: Verify Dependabot security alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          alerts="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            --jq '.[] | select(.security_advisory.severity == "high" or .security_advisory.severity == "critical") | .html_url')"
          if [[ -n "${alerts}" ]]; then
            echo "Open high or critical Dependabot alerts block release publication:" >&2
            echo "${alerts}" >&2
            exit 1
          fi

      - name: Check Maven Central publication
        id: central_publication
        env:
          RELEASE_VERSION: ${{ steps.release_source.outputs.version }}
        run: |
          set -euo pipefail

          central_pom_url="https://repo.maven.apache.org/maven2/io/github/xfoundries/jfoundry-parent/${RELEASE_VERSION}/jfoundry-parent-${RELEASE_VERSION}.pom"
          central_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' --head "${central_pom_url}"
          )"
          case "${central_status}" in
            200) echo "already_published=true" >> "${GITHUB_OUTPUT}" ;;
            404) echo "already_published=false" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "Central publication lookup returned unexpected HTTP status: ${central_status}" >&2
              exit 1
              ;;
          esac

      - name: Install Apache Maven 3 for Central publication
        id: maven_3
        env:
          MAVEN_3_VERSION: 3.9.16
          MAVEN_3_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_3_VERSION}-bin.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --output "${archive}" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_3_VERSION}/apache-maven-${MAVEN_3_VERSION}-bin.tar.gz"
          printf '%s  %s\n' "${MAVEN_3_SHA512}" "${archive}" | sha512sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"

          executable="${RUNNER_TEMP}/apache-maven-${MAVEN_3_VERSION}/bin/mvn"
          "${executable}" --version
          echo "executable=${executable}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Maven 3 publication tree
        run: |
          set -euo pipefail
          publication_tree="${RUNNER_TEMP}/jfoundry-maven3-publication-tree"
          bash scripts/generate-maven3-publication-tree.sh "${publication_tree}"
          echo "PUBLICATION_EVIDENCE_ROOT=${publication_tree}" >> "${GITHUB_ENV}"

      - name: Publish Maven Central deployment
        id: publish_central
        if: steps.central_publication.outputs.already_published != 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          publication_tree="${RUNNER_TEMP}/jfoundry-maven3-publication-tree"
          (
            cd "${publication_tree}"
            "${{ steps.maven_3.outputs.executable }}" -B -T 1 -Prelease -DskipTests deploy \
              "-DaltDeploymentRepository=jfoundry::file:${RUNNER_TEMP}/jfoundry-release-deployment" \
              -Dgpg.passphrase="${GPG_PASSPHRASE}" 2>&1 | tee "${GITHUB_WORKSPACE}/central-deploy.log"
          )
          deployment_id="$(sed -nE 's/.*deploymentId: ([[:alnum:]-]+).*/\1/p' central-deploy.log | tail -n 1)"
          if [[ -z "${deployment_id}" ]]; then
            echo "Central Publishing did not report a deploymentId." >&2
            exit 1
          fi
          echo "Central deployment created: ${deployment_id}"

      - name: Rebuild existing release evidence with Maven 3
        if: steps.central_publication.outputs.already_published == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          publication_tree="${RUNNER_TEMP}/jfoundry-maven3-publication-tree"
          (
            cd "${publication_tree}"
            "${{ steps.maven_3.outputs.executable }}" -B -T 1 -Prelease -DskipTests verify \
              -Dgpg.passphrase="${GPG_PASSPHRASE}"
          )

      - name: Record existing Maven Central publication
        id: record_existing_publication
        if: steps.central_publication.outputs.already_published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release_source.outputs.version }}
        run: |
          set -euo pipefail
          printf 'Maven Central already contains io.github.xfoundries:jfoundry-parent:%s. Deployment was not retried.\n' \
            "${RELEASE_VERSION}" > central-deploy.log

      - name: Verify Maven Central publication
        id: central_publication_complete
        env:
          RELEASE_VERSION: ${{ steps.release_source.outputs.version }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 40); do
            central_pom_url="https://repo.maven.apache.org/maven2/io/github/xfoundries/jfoundry-parent/${RELEASE_VERSION}/jfoundry-parent-${RELEASE_VERSION}.pom"
            central_status="$(
              curl --silent --show-error --output /dev/null --write-out '%{http_code}' --head \
                --connect-timeout 5 --max-time 5 "${central_pom_url}"
            )"
            case "${central_status}" in
              200)
                echo "published=true" >> "${GITHUB_OUTPUT}"
                exit 0
                ;;
              404) ;;
              *)
                echo "Central publication lookup returned unexpected HTTP status: ${central_status}" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Maven Central did not expose io.github.xfoundries:jfoundry-parent:${RELEASE_VERSION} within 10 minutes." >&2
          exit 1

      - name: Capture Maven Central deployment details
        id: central_deployment_evidence
        if: ${{ always() && (steps.publish_central.conclusion != 'skipped' || steps.record_existing_publication.conclusion != 'skipped') }}
        run: |
          set -euo pipefail

          mkdir -p release-evidence
          {
            echo "release_version=${{ steps.release_source.outputs.version }}"
            echo "central_repository_group=io.github.xfoundries"
            echo "central_repository_artifact=jfoundry-parent"
            echo "central_repository_published=${{ steps.central_publication_complete.outputs.published }}"
            echo
            if [[ -f central-deploy.log ]]; then
              grep -Ei 'deployment|publish|status' central-deploy.log || true
            else
              echo "central-deploy.log was not created before the release workflow stopped."
            fi
          } > release-evidence/central-deployment.txt

      - name: Upload Maven Central deployment details
        if: ${{ always() && steps.central_deployment_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.release_tag }}-central-deployment
          path: |
            release-evidence/central-deployment.txt
            central-deploy.log
          if-no-files-found: error

      - name: Assemble release evidence
        run: |
          set -euo pipefail

          artifact_root="${PUBLICATION_EVIDENCE_ROOT}"
          mkdir -p release-evidence/artifacts release-evidence/consumer-poms release-evidence/signatures release-evidence/sboms
          while IFS= read -r artifact; do
            module="${artifact#${artifact_root}/}"
            module="${module%/target/*}"
            target="release-evidence/artifacts/${module//\//_}-$(basename "${artifact}")"
            cp "${artifact}" "${target}"
          done < <(find "${artifact_root}" -path '*/target/*.jar' -type f ! -path '*/target/project-local-repo/*' | sort)
          while IFS= read -r pom; do
            relative_pom="${pom#${CONSUMER_POM_REPOSITORY}/}"
            target="release-evidence/consumer-poms/${relative_pom}"
            mkdir -p "$(dirname "${target}")"
            cp "${pom}" "${target}"
          done < <(find "${CONSUMER_POM_REPOSITORY}/io/github/xfoundries" -name '*.pom' ! -name '*-build.pom' -type f | sort)
          signature_count=0
          while IFS= read -r signature; do
            module="${signature#${artifact_root}/}"
            module="${module%/target/*}"
            target="release-evidence/signatures/${module//\//_}-$(basename "${signature}")"
            cp "${signature}" "${target}"
            signature_count=$((signature_count + 1))
          done < <(find "${artifact_root}" -path '*/target/*.asc' -type f ! -path '*/target/project-local-repo/*' | sort)
          if (( signature_count == 0 )); then
            echo "Release build produced no GPG signature files." >&2
            exit 1
          fi
          while IFS= read -r sbom; do
            module="${sbom#${artifact_root}/}"
            module="${module%/target/*}"
            cp "${sbom}" "release-evidence/sboms/${module//\//_}-$(basename "${sbom}")"
          done < <(find "${artifact_root}" -path '*/target/bom.*' -type f ! -path '*/target/project-local-repo/*' | sort)
          cp central-deploy.log release-evidence/central-deploy.log
          {
            echo "release_tag=${{ inputs.release_tag }}"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "artifact_evidence_root=${artifact_root}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-evidence/release-metadata.txt
          find release-evidence -type f -print0 | sort -z | xargs -0 shasum -a 256 > release-evidence/SHA256SUMS

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.release_tag }}-release-evidence
          path: release-evidence
          if-no-files-found: error

      - name: Archive release evidence
        run: tar -czf release-evidence.tar.gz release-evidence

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-evidence.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release_source.outputs.version }}
        run: |
          set -euo pipefail

          is_prerelease=false
          case "${RELEASE_VERSION}" in
            *-*) is_prerelease=true ;;
          esac

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_tag="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')"
            test "${release_tag}" = "${RELEASE_TAG}"
            gh release upload "${RELEASE_TAG}" release-evidence.tar.gz --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --draft=false --prerelease="${is_prerelease}"
            exit 0
          fi

          release_flags=(--verify-tag)
          if [[ "${is_prerelease}" == "true" ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "${RELEASE_TAG}" release-evidence.tar.gz "${release_flags[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --generate-notes
