version: 2
updates:
  # Dependabot's Maven fetcher follows <modules> only and does not group updates across
  # directory jobs. Maven 4.1 <subprojects> are therefore invisible. List BOM manifests
  # explicitly. The Quarkus and Spring Boot platform pairs are reached through their
  # src/test/dependabot-reactor aggregators so both literals land in one job. Do not scan
  # /jfoundry-runtime/*: those aggregators use inferred parents and ${project.version}.
  - package-ecosystem: maven
    directories:
      - "/"
      - "/jfoundry-boms/jfoundry-dependencies"
      - "/jfoundry-boms/jfoundry-foundation-dependencies"
      - "/jfoundry-boms/jfoundry-helidon-dependencies"
      - "/jfoundry-boms/jfoundry-modules-dependencies"
      - "/jfoundry-boms/jfoundry-quarkus-build/src/test/dependabot-reactor"
      - "/jfoundry-boms/jfoundry-spring-boot-parent/src/test/dependabot-reactor"
      - "/jfoundry-boms/jfoundry-spring-cloud-dependencies"
    schedule:
      interval: daily
    # Zero days disables Dependabot's default three-day version-update cooldown.
    # An unpublished platform coordinate must not be delayed into a mismatched
    # update; close that pull request instead of waiting for a later publication.
    cooldown:
      default-days: 0
      semver-major-days: 0
      semver-minor-days: 0
      semver-patch-days: 0
    open-pull-requests-limit: 10
    rebase-strategy: disabled
    groups:
      jfoundry-spring-boot-platform:
        patterns:
          - org.springframework.boot:spring-boot-dependencies
          - org.springframework.boot:spring-boot-starter-parent
          - org.springframework.boot:spring-boot-maven-plugin
        update-types: [patch, minor]
      jfoundry-quarkus-platform:
        patterns:
          - io.quarkus.platform:quarkus-bom
          - io.quarkus:quarkus-extension-maven-plugin
          - io.quarkus:quarkus-extension-processor
          - io.quarkus:quarkus-maven-plugin
        update-types: [patch, minor]
      jfoundry-maven-patches:
        patterns: ["*"]
        update-types: [patch]
      jfoundry-maven-minors:
        patterns: ["*"]
        update-types: [minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-codeql-action:
        patterns: [github/codeql-action/*]
