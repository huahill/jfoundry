version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: org.jmolecules.integrations:jmolecules-spring
        versions: ["1.6.0"]
    groups:
      jfoundry-maven-patches:
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-codeql-action:
        patterns: [github/codeql-action/*]
